// The secrets role's service, which the Integration Sidecars, ingress, spawner
// and the Entry Node reach over gRPC (implementation §1.2.18, §6, The off-Bus
// interfaces).
syntax = "proto3";
package zobik.secrets.v1;

option go_package = "zobik.org/zobik/proto/zobik/secrets/v1;secretsv1";

service Secrets {
  rpc Resolve(SecretRequest) returns (Secret);
  rpc Check(SecretRequest)   returns (CheckAck);
}

message SecretRequest {
  string handle     = 1;
  string credential = 2;  // capability credential, compact JWS; empty from a role
}

message Secret {
  bytes value = 1;
}

message CheckAck {}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zobik</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<form id="signin" class="signin" hidden>
  <h1>Zobik</h1>
  <input name="username" placeholder="Username" autocomplete="username" required>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button>Sign in</button>
  <p id="signin-error" class="error"></p>
</form>

<div id="panel" class="panel" hidden>
  <nav class="side">
    <header>
      <strong>Zobik</strong>
      <button id="signout" class="link">Sign out</button>
    </header>
    <button id="new">New conversation</button>
    <ul id="conversations"></ul>
  </nav>

  <main class="main">
    <section id="expired" class="notices" hidden>
      <header><strong>While you were away</strong> <button id="expired-close" class="link">Close</button></header>
      <ul id="expired-list"></ul>
    </section>
    <p id="unavailable" class="error" hidden></p>
    <div id="empty" class="empty">Choose a conversation or start a new one.</div>
    <div id="conversation" hidden>
      <header class="conv-header">
        <h2 id="title"></h2>
        <button id="delete" class="link danger">Delete conversation</button>
      </header>
      <ol id="messages"></ol>
      <form id="composer" class="composer">
        <textarea name="text" rows="3" placeholder="Write a request"></textarea>
        <div class="row">
          <input type="file" name="file" multiple>
          <button>Send</button>
        </div>
        <p id="composer-error" class="error"></p>
      </form>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
